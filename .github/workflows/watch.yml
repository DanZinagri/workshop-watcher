name: Workshop Watcher

on:
  schedule:
    # Every 15 minutes. GitHub often delays scheduled runs under load,
    # so treat this as "roughly every 15-20 minutes".
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      baseline:
        description: 'Re-snapshot collections without posting changes'
        type: boolean
        default: false

permissions:
  contents: write

# Never let two runs race on the state files.
concurrency:
  group: workshop-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Check collections
        run: node watch.mjs ${{ inputs.baseline && '--baseline' || '' }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      # GitHub disables scheduled workflows after 60 days with no repo
      # activity. Snapshot commits only happen when a collection actually
      # changes, so a quiet stretch would silently kill the schedule. Writing
      # the date (not the time) guarantees at most one extra commit per day.
      - name: Heartbeat
        if: always()
        run: date -u +%Y-%m-%d > state/last-run.txt

      # Runs even if the check failed, so a partial success still records
      # its snapshot and doesn't re-alert on the next run.
      - name: Save snapshots
        if: always()
        run: |
          git config user.name 'workshop-watcher'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state
          if git diff --staged --quiet; then
            echo 'No snapshot changes.'
            exit 0
          fi
          git commit -m 'state: update collection snapshots [skip ci]'
          git pull --rebase --autostash
          git push
