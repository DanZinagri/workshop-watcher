name: Workshop Watcher

# GitHub's cron is best-effort and only delivered a handful of runs a day
# here, so each run now checks every 5 minutes for ~5.5 hours and then
# starts its own successor. The schedule is only a backstop that restarts
# the chain if it ever breaks.
on:
  schedule:
    - cron: '3,18,33,48 * * * *'
  workflow_dispatch:
    inputs:
      baseline:
        description: 'Re-snapshot collections without posting changes (first check only)'
        type: boolean
        default: false

permissions:
  contents: write # commit snapshots
  actions: write # start the next run

# One run at a time. A run that arrives while another is checking waits as
# the single pending run, replacing any older pending one, so whichever run
# ends up queued carries the chain on.
concurrency:
  group: workshop-watcher
  cancel-in-progress: false

env:
  CHECK_INTERVAL_SECONDS: 300
  # Jobs are killed at 6 hours. Leave room for setup and the hand-off.
  LOOP_MINUTES: 330

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Check collections every 5 minutes
        timeout-minutes: 345
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_HOMEBREW: ${{ secrets.DISCORD_WEBHOOK_HOMEBREW }}
          FIRST_ARGS: ${{ inputs.baseline && '--baseline' || '' }}
        run: |
          git config user.name 'workshop-watcher'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          sync() {
            git pull --rebase --autostash -q || { git rebase --abort 2>/dev/null; echo '::warning::git pull failed'; }
          }

          deadline=$(( $(date +%s) + LOOP_MINUTES * 60 ))
          args="$FIRST_ARGS"
          quiet=''
          while :; do
            started=$(date +%s)
            # Pick up edits to collections.json / watch.mjs pushed mid-run.
            sync

            if WATCHER_QUIET_ERRORS="$quiet" node watch.mjs $args; then quiet=''; else quiet=1; fi
            args=''

            # Keeps the repo active so GitHub never disables the backstop
            # schedule; changes at most once a day.
            date -u +%Y-%m-%d > state/last-run.txt

            # Saved even after a failed check, so a partial success records
            # its snapshot and doesn't re-alert next time.
            git add state
            if ! git diff --staged --quiet; then
              git commit -q -m 'state: update collection snapshots [skip ci]'
              sync
              git push -q || echo '::warning::push failed; will retry after the next check'
            fi

            next=$(( started + CHECK_INTERVAL_SECONDS ))
            if [ "$next" -ge "$deadline" ]; then break; fi
            wait=$(( next - $(date +%s) ))
            if [ "$wait" -gt 0 ]; then sleep "$wait"; fi
          done

      # Skipped when a run is cancelled, so cancelling the active run in the
      # Actions tab stops the chain (until the backstop schedule fires).
      - name: Start the next run
        if: success() || failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run watch.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
